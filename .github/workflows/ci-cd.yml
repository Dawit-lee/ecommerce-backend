name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── CI: 빌드 + 테스트 (Postgres 컨테이너로 실제 DB 연동 검증) ──
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build & Test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myapp
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123456789
          STRIPE_SECRET_KEY: sk_test_ci_dummy
        run: ./mvnw -B clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/sb-ecom-0.0.1-SNAPSHOT.jar
          retention-days: 5

  # ── CD: main 브랜치에서만 Elastic Beanstalk 배포 ──
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check AWS secrets
        id: secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_ACCESS_KEY_ID 시크릿이 없어 배포를 건너뜁니다. (저장소 Settings → Secrets 에 등록 필요)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download jar artifact
        if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Deploy to Elastic Beanstalk
        if: steps.secrets.outputs.present == 'true'
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ecom-app
          environment_name: Ecom-app-env
          region: ap-northeast-2
          version_label: gh-${{ github.run_number }}-${{ github.sha }}
          deployment_package: target/sb-ecom-0.0.1-SNAPSHOT.jar
          wait_for_environment_recovery: 180
